<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#176b4d" />
    <meta name="description" content="Die MO-Ni-Mathe-App mit Terminen, Trainingsarchiven, Knobelreise, Sonntagsrätseln und Arbeitsheften." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MO-Ni 0.14" />
    <script>
      window.__moNiDeferredInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        window.__moNiDeferredInstallPrompt = event;
      });
    </script>
    <link rel="manifest" href="./manifest.webmanifest?v=0.14.0-release-2" />
    <link rel="icon" href="./assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon-180.png" />
    <link rel="stylesheet" href="./styles.css?v=0.14.0-release-4b" />
    <link rel="stylesheet" href="./pdf-actions.css?v=0.14.0-release-2" />
    <title>MO-Ni – Unterwegs mit MO und Ni</title>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div id="app" class="app-shell"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module">
      if (location.protocol === "file:") {
        document.querySelector("#app").innerHTML = `<main class="file-start-page">
          <img src="./assets/mo-ni-kanallogo.png" alt="MO und Ni" />
          <span class="version-badge">V0.14</span>
          <h1>Bitte die App über die Startdatei öffnen</h1>
          <p>Beim direkten Öffnen dieser Datei können Videos und Aufgabenblätter aus Sicherheitsgründen nicht geladen werden.</p>
          <div class="file-start-instruction"><strong>So funktioniert es:</strong><span>Dieses Fenster schließen und im Projektordner <b>Start-Version-0.14-Vorschau.command</b> doppelklicken.</span></div>
          <small>Diese Vorschau hat eine eigene Startdatei, damit sie nicht mit der bisherigen App verwechselt wird.</small>
        </main>`;
      } else {
        await import("./app.js?v=0.14.0-release-4");
      }
    </script>
  </body>
</html>
