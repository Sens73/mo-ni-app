# Automatische Prüfung: läuft bei jedem Entwurf (Pull Request) und bei jeder
# Änderung auf main. Ein grüner Haken heißt: alle Tests der App bestehen.
name: Prüfung

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests der App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: App-Tests (npm test)
        run: npm test
      - name: Arbeitsheft-Werkzeug (Python)
        working-directory: Serverautomatisierung/arbeitsheft
        run: python -m unittest discover -s tests

  browser:
    name: App im Browser (iPhone- und Android-Größe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser einrichten
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: App öffnen, alle Bereiche anklicken, Flugmodus prüfen
        run: npm run test:browser
