name: Wächter

# Prüft jeden Morgen, ob in der App auf mo-ni.de etwas fehlt, das schon öffentlich ist.
# Schlägt die Prüfung fehl, schickt GitHub automatisch eine E-Mail an den Inhaber des Repos.
on:
  schedule:
    # 17:15 Uhr UTC = 18:15 Uhr in Deutschland (Winterzeit), nach dem täglichen Abgleich auf dem Mac.
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    name: Fehlt etwas in der App?
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Öffentliche Seiten mit der App vergleichen
        run: node scripts/waechter.mjs
