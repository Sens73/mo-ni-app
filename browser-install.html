<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#176b4d" />
    <meta name="description" content="MO-Ni im Browser öffnen und zum Home-Bildschirm hinzufügen." />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MO-Ni 0.13" />
    <script>
      window.__moNiDeferredInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        window.__moNiDeferredInstallPrompt = event;
      });
      const publishedInstaller = location.pathname === "/fileadmin/mo-ni-grundschul-app-installieren.html";
      const appBase = publishedInstaller ? "/fileadmin/grundschule-app-test/" : "./";
      const manifestFile = publishedInstaller ? "manifest.json" : "manifest.webmanifest";
      const iconPrefix = publishedInstaller ? "./" : "./assets/icons/";
      document.write(`<base href="${appBase}">`);
      document.write(`<link rel="manifest" href="./${manifestFile}?v=0.14.0-release-2">`);
      document.write(`<link rel="icon" href="${iconPrefix}icon-192.png">`);
      document.write(`<link rel="apple-touch-icon" sizes="180x180" href="${iconPrefix}apple-touch-icon-180.png">`);
      document.write('<link rel="stylesheet" href="./styles.css?v=0.14.0-release-3">');
      document.write('<link rel="stylesheet" href="./pdf-actions.css?v=0.14.0-release-2">');
    </script>
    <title>MO-Ni installieren</title>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div id="app" class="app-shell"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module">
      await import(new URL("./app.js?v=0.14.0-release-3", document.baseURI).href);
    </script>
  </body>
</html>
